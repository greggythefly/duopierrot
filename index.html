<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12A99B">
<meta name="description" content="Appli de révision d'anglais (Première) : connecteurs, structures, méthode de production écrite, lettre argumentative.">
<style>[hidden]{display:none!important} body{margin:0} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%}</style>
<title>Writing Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: a single centred phone-width column; home = zig-zag learning path, lesson = full-screen card with a sliding feedback tray */
:root{
  --bg:#F2F6FF; --surface:#FFFFFF; --surface2:#E8EEFC; --line:#D5DDF0; --fg:#1B2340; --muted:#5F6A8C;
  --brand:#12A99B; --brand-d:#0C7F74; --brand-bg:#DDF5F2;
  --ok:#2BB55B; --ok-d:#1E8C45; --ok-bg:#DDF6E5; --ok-fg:#14652F;
  --bad:#F2545B; --bad-d:#C93A41; --bad-bg:#FFE2E3; --bad-fg:#9C2329;
  --sun:#FFBE2E; --sun-d:#D99A0B; --flame:#FF7A1A;
  --c1:#12A99B; --c1d:#0C7F74; --c2:#FF7A1A; --c2d:#CC5B08; --c3:#E5468F; --c3d:#B42C6C;
  --c4:#3D7BF2; --c4d:#2557BE; --c5:#7A5AF0; --c5d:#5638C2; --c6:#F2A516; --c6d:#C27F00; --c7:#E8513D; --c7d:#B53524;
  --c8:#169B62; --c8d:#0F7449; --c9:#A0692B; --c9d:#784D1C; --c10:#6E9B1E; --c10d:#517514; --c11:#B5527F; --c11d:#8C3A60; --c12:#1A93B8; --c12d:#0F6E8C;
  --onc:#FFFFFF; --shadow:0 2px 0 rgba(27,35,64,.06), 0 8px 24px rgba(27,35,64,.06);
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1426; --surface:#171F38; --surface2:#202A49; --line:#2F3B62; --fg:#EEF2FF; --muted:#9BA6CA;
  --brand-bg:#123A3A; --ok-bg:#133523; --ok-fg:#8BE3A8; --bad-bg:#43191D; --bad-fg:#FFB0B4;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1426; --surface:#171F38; --surface2:#202A49; --line:#2F3B62; --fg:#EEF2FF; --muted:#9BA6CA;
  --brand-bg:#123A3A; --ok-bg:#133523; --ok-fg:#8BE3A8; --bad-bg:#43191D; --bad-fg:#FFB0B4;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* ---- top bar ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brandname span{white-space:nowrap}.brandname{min-width:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brandname small{font-family:var(--f-body);font-weight:800;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:block;line-height:1}
.pill{flex:none;white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:900;font-size:15px;padding:5px 9px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.pill.fire{color:var(--flame)} .pill.xp{color:var(--sun-d)}
.iconbtn{flex:none;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px}

/* ---- cards ---- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:4px}
.ring{width:78px;height:78px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.goal h2{font-size:20px}
.goal p{margin:2px 0 10px;color:var(--muted);font-weight:700;font-size:14px}
.week{display:flex;gap:6px;margin-top:12px;grid-column:1/-1}
.week div{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.week i{display:block;height:26px;border-radius:9px;background:var(--surface2);margin-bottom:3px;position:relative;overflow:hidden}
.week i.on{background:var(--flame)} .week i.today{outline:2px solid var(--flame);outline-offset:1px}

/* ---- 3D buttons ---- */
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--brand);color:var(--onc);box-shadow:0 4px 0 var(--brand-d);transition:transform .06s, box-shadow .06s, filter .15s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--brand-d)}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{background:var(--surface2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;filter:none;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:var(--surface);color:var(--brand-d);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--brand)}}

/* ---- path ---- */
.section-title{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 2px 6px;font-weight:600}
.path{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.node{display:flex;align-items:center;gap:14px;background:none;border:0;padding:6px 0;text-align:left;width:100%}
.node:nth-child(4n+2){padding-left:42px}.node:nth-child(4n+3){padding-left:84px}.node:nth-child(4n+4){padding-left:42px}
.bubble{position:relative;flex:none;width:84px;height:84px;display:grid;place-items:center}
.bubble svg{position:absolute;inset:0;transform:rotate(-90deg)}
.disc{width:64px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--uc);box-shadow:0 6px 0 var(--ucd);transition:transform .08s}
.node:active .disc{transform:translateY(5px);box-shadow:0 1px 0 var(--ucd)}
.node .lbl{min-width:0}
.node .lbl b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.node .lbl span{display:block;color:var(--muted);font-size:13px;font-weight:700}
.node .lbl em{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--onc);background:var(--uc);border-radius:7px;padding:2px 7px;display:inline-block;margin-top:4px}
.start-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--brand-d);font-weight:900;font-size:11px;padding:2px 8px;border-radius:9px;letter-spacing:.06em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:1}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

.science{display:grid;gap:10px}
.science .row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.science .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface2)}
.science b{font-family:var(--f-display);font-weight:600;font-size:16px}
.science p{margin:0;color:var(--muted);font-size:14px;font-weight:600}

/* ---- tab bar ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{display:flex;gap:6px;max-width:560px;width:100%}
.tabs button{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 4px;font-weight:900;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;letter-spacing:.04em;text-transform:uppercase}
.tabs button span{font-size:22px}
.tabs button.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand-d)}
:root[data-theme="dark"] .tabs button.on{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button.on{color:var(--brand)}}

/* ---- fiches ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px}
.chip.on{background:var(--uc);border-color:var(--uc);color:var(--onc)}
.fgroup{margin-top:14px}
.fgroup h3{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fgroup h3 i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--uc);font-size:16px}
.fl{display:grid;gap:8px}
.fitem{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.fitem .en{font-weight:900;font-size:16px}
.fitem .fr{color:var(--muted);font-weight:700;font-size:14px}
.fitem .exs{grid-column:1/-1;font-size:14px;font-style:italic;color:var(--fg);opacity:.85;margin-top:2px}
.fitem .tip{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--brand-d);margin-top:2px}
:root[data-theme="dark"] .fitem .tip{color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fitem .tip{color:var(--brand)}}
.lvl{display:flex;gap:2px}
.lvl s{display:block;width:6px;height:14px;border-radius:3px;background:var(--surface2)}
.lvl s.on{background:var(--uc)}
.say{border:0;background:var(--surface2);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:16px;flex:none}
.letter{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:15px;line-height:1.6}
.letter p{margin:0 0 10px}
.letter mark{background:var(--sun);color:#1B2340;border-radius:5px;padding:0 3px;font-weight:800}

/* ---- stats ---- */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.bar .t{font-weight:800;font-size:14px;margin-bottom:4px}
.bar .track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--uc);border-radius:99px}
.bar .pc{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---- lesson ---- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:640px;width:100%;margin:0 auto}
.close{border:0;background:none;font-size:26px;color:var(--muted);width:36px;height:36px;line-height:1}
.prog{flex:1;height:16px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--flame);font-size:15px;min-width:46px;text-align:right}
.lbody{flex:1;overflow-y:auto;width:100%}
.lin{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.kicker{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--uc);display:flex;align-items:center;gap:8px}
.kicker .new{background:var(--sun);color:#1B2340;border-radius:7px;padding:1px 7px;font-size:11px}
.q{font-size:24px;line-height:1.25}
.qrow{display:flex;gap:12px;align-items:flex-start}
.mascot{flex:none;width:64px;height:64px}
.speech{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:18px;flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.speech::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speech span{flex:1;min-width:0}
.sentence{font-size:20px;font-weight:800;line-height:1.6;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.sentence span{flex:1}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--uc);padding:0 6px;color:var(--uc);text-align:center}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-weight:800;font-size:17px;transition:transform .05s}
.opt:active{transform:translateY(2px)}
.opt kbd{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--c4);background:color-mix(in srgb,var(--c4) 12%,var(--surface));color:var(--c4)}
.opt.sel kbd{border-color:var(--c4);color:var(--c4)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-fg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-fg)}
.opt.big{justify-content:center;font-size:22px;padding:22px}
.answerline{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px}
.answerline.col{flex-direction:column;flex-wrap:nowrap;border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank.col{flex-direction:column;align-items:stretch}
.tok{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:17px}
.tok.ghost{visibility:hidden}
.tok.used{background:var(--surface2);color:transparent;border-color:var(--surface2)}
.answerline.col .tok, .bank.col .tok{text-align:left;font-size:15px}
.tok .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--uc);color:var(--onc);font-size:12px;margin-right:8px}
.typein{width:100%;font:inherit;font-weight:800;font-size:20px;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.typein:focus{border-color:var(--c4);outline:none}
.hintbtn{align-self:flex-start;border:0;background:none;color:var(--c4);font-weight:900;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pair{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 10px;font-weight:800;font-size:15px;min-height:56px}
.pair.sel{border-color:var(--c4);color:var(--c4);background:color-mix(in srgb,var(--c4) 12%,var(--surface))}
.pair.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-fg);opacity:.55;pointer-events:none}
.pair.err{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-fg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lfoot{border-top:2px solid var(--line);background:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .2s}
.lfoot .in{max-width:640px;margin:0 auto;display:grid;gap:12px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:none;gap:12px;align-items:flex-start}
.lfoot.ok .fb,.lfoot.bad .fb{display:flex;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.fb .badge{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface)}
.fb h3{font-size:21px}
.lfoot.ok .fb h3{color:var(--ok-fg)} .lfoot.bad .fb h3{color:var(--bad-fg)}
.fb p{margin:3px 0 0;font-weight:700;font-size:15px}
.lfoot.ok .fb p{color:var(--ok-fg)} .lfoot.bad .fb p{color:var(--bad-fg)}
.fb .why{font-weight:600;opacity:.9}
.fb .say{background:var(--surface)}
.fbtext{flex:1;min-width:0}
.result{max-width:520px;margin:0 auto;padding:30px 16px;text-align:center;display:grid;gap:18px;justify-items:center}
.result h1{font-size:32px;color:var(--sun-d)}
.result p{margin:0;color:var(--muted);font-weight:700;max-width:40ch}
.result .tiles{width:100%}
.result .tile{border-color:var(--tc);}
.result .tile b{color:var(--tc)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:up .2s ease-out}
.sheet .hd{display:flex;gap:12px;align-items:center}
.sheet .hd .disc{width:54px;height:50px;font-size:24px;flex:none}
.sheet h2{font-size:22px}
.sheet p{margin:0;color:var(--muted);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:50}
@media (max-width:420px){.top{gap:6px}.brandname{font-size:18px}.brandname small{font-size:9px}.pill{font-size:14px;padding:4px 8px}.q{font-size:21px}.sentence{font-size:18px}.opt{font-size:16px}.node:nth-child(4n+3){padding-left:64px}.node:nth-child(4n+2),.node:nth-child(4n+4){padding-left:32px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<script src="audio.js" async></script>
<div id="app"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* =========================================================
   CONTENU — tiré des 3 fiches de Première C

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const dayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function curStreak(){ if(!S.lastDay) return 0; const t=dayKey(), y=dayKey(new Date(Date.now()-DAY)); return (S.lastDay===t||S.lastDay===y)?S.streak:0; }
const rec = id => S.srs[id] || null;
const lvl = id => (S.srs[id]?.lvl)||0;
const isDue = id => { const r=rec(id); return r && r.due<=Date.now(); };
function mastery(unitId){ const its=ITEMS.filter(i=>i.units.includes(unitId)); return its.reduce((a,i)=>a+lvl(i.id),0)/(its.length*MAXLVL); }
function dueItems(){ return ITEMS.filter(i=>isDue(i.id)); }
function grade(id, ok){
  const r = S.srs[id] || {lvl:0,due:0,right:0,wrong:0,seen:0};
  r.seen++; r.last=Date.now();
  if(ok){ r.lvl=Math.min(MAXLVL,r.lvl+1); r.right++; r.due=Date.now()+INTERVALS[r.lvl]*(0.9+Math.random()*0.2); }
  else { r.lvl=Math.max(0,r.lvl-2); r.wrong++; r.due=Date.now()+10*MIN; }
  S.srs[id]=r;
}

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const sample = (a,n) => shuffle(a).slice(0,n);
const unitOf = it => UNITS.find(u=>u.id===it.units[0]);
const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
const low = w => w.charAt(0).toLowerCase()+w.slice(1);
function fmtGap(word, atStart, keep){ if(atStart) return cap(word); if(keep) return word; return low(word); }
const sameFr = (a,b) => frParts(a.fr).some(p=>frParts(b.fr).includes(p));
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j; for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

// voix britanniques de bonne qualité, par ordre de préférence (Edge, Chrome, Safari/iOS, Android)
const PREF=[/Sonia.*Natural/i,/Libby.*Natural/i,/Ryan.*Natural/i,/Maisie.*Natural/i,/Thomas.*Natural/i,/Google UK English Female/i,/Google UK English Male/i,/Serena/i,/Daniel/i,/Kate/i,/Arthur/i,/Martha/i,/Stephanie/i,/Oliver/i,/Hazel/i,/George/i,/Susan/i];
const isEn = v => /^en([-_]|$)/i.test(v.lang||'');
function englishVoices(){ return loadVoices().filter(isEn).sort((a,b)=>(/GB/i.test(b.lang)-/GB/i.test(a.lang))||a.name.localeCompare(b.name)); }
function bestVoice(){
  const en=englishVoices(); if(!en.length) return null;
  if(S.voice){ const v=en.find(v=>v.voiceURI===S.voice||v.name===S.voice); if(v) return v; }
  const gb=en.filter(v=>/en[-_]GB/i.test(v.lang));
  for(const re of PREF){ const v=gb.find(v=>re.test(v.name)); if(v) return v; }
  return gb.find(v=>!v.localService) || gb[0] || en.find(v=>/en[-_](IE|AU|NZ)/i.test(v.lang)) || en.find(v=>/en[-_]US/i.test(v.lang)) || en[0];
}
function cleanSay(t){ return String(t).replace(/_{3}/g,' … ').replace(/\s*(\.\.\.|…)\s*(?=\w)/g,', ').replace(/(\.\.\.|…)/g,'').replace(/→/g,', ').replace(/\s+/g,' ').trim(); }
// ---- audio pré-enregistré (voix britannique), puis synthèse du navigateur en secours ----
const akey = t => cleanSay(String(t).replace(/_{3}/g,' ')).toLowerCase().replace(/[^a-z0-9']+/g,' ').trim();
const clipCache={}; let clipSrc=null, clipCtx=null;
function b64buf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
async function playClip(k){
  try{
    clipCtx = clipCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(clipCtx.state==='suspended') await clipCtx.resume();
    if(!clipCache[k]) clipCache[k] = await new Promise((res,rej)=>clipCtx.decodeAudioData(b64buf(window.WQ_AUDIO[k]),res,rej));
    try{ if(clipSrc) clipSrc.stop(); }catch(e){}
    try{ speechSynthesis.cancel(); }catch(e){}
    const src=clipCtx.createBufferSource(); src.buffer=clipCache[k]; src.connect(clipCtx.destination); src.start(); clipSrc=src;
    return true;
  }catch(e){ return false; }
}
// Lecture par un élément <audio> unique : fonctionne sur iPhone même en mode silencieux,
// et reste « déverrouillé » après le premier toucher pour les lectures automatiques.
let clipEl=null;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function audioEl(){ if(!clipEl){ clipEl=new Audio(); clipEl.preload='auto'; clipEl.setAttribute('playsinline',''); clipEl.setAttribute('webkit-playsinline',''); } return clipEl; }
function unlockAudio(){
  try{ const el=audioEl(); if(!el.dataset.unlocked){ el.dataset.unlocked='1'; el.src=SILENT; const p=el.play(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  try{ clipCtx = clipCtx || new (window.AudioContext||window.webkitAudioContext)(); if(clipCtx.state==='suspended') clipCtx.resume(); }catch(e){}
}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function playEl(k){
  return new Promise(res=>{
    try{
      const el=audioEl();
      try{ speechSynthesis.cancel(); }catch(e){}
      try{ if(clipSrc) clipSrc.stop(); }catch(e){}
      el.pause(); el.src='data:audio/mpeg;base64,'+window.WQ_AUDIO[k];
      const p=el.play(); if(p&&p.then) p.then(()=>res(true),()=>res(false)); else res(true);
    }catch(e){ res(false); }
  });
}
function speak(t,wait=0){
  const k=akey(t);
  if(!window.WQ_AUDIO){ // enregistrements encore en chargement : on attend un peu
    if(wait<40) return setTimeout(()=>speak(t,wait+1),250);
    return ttsSpeak(t);
  }
  if(window.WQ_AUDIO[k]){ playEl(k).then(ok=>{ if(ok) return; playClip(k).then(ok2=>{ if(!ok2) ttsSpeak(t); }); }); return; }
  ttsSpeak(t);
}
function ttsSpeak(t,tries=0){
  try{
    if(!('speechSynthesis' in window)) return;
    const v=bestVoice();
    if(!v){ if(tries<4) return setTimeout(()=>ttsSpeak(t,tries+1),250);
      if(!speak.warned){ speak.warned=1; toast('Aucune voix anglaise sur cet appareil : ajoute une voix « English (UK) » dans les réglages du système.'); }
      return; } // jamais de lecture avec une voix française
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(cleanSay(t)); u.voice=v; u.lang=v.lang.replace('_','-'); u.rate=.9; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx=null;
function beep(kind){
  if(!S.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const now=actx.currentTime;
    const notes = kind==='ok'?[[660,0],[990,.09]] : kind==='win'?[[523,0],[659,.12],[784,.24],[1047,.36]] : kind==='tap'?[[420,0]] : [[220,0],[180,.12]];
    notes.forEach(([f,t])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=kind==='bad'?'triangle':'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(kind==='tap'?.05:.18,now+t+.02); g.gain.exponentialRampToValueAtTime(0.0001,now+t+(kind==='tap'?.06:.22));
      o.connect(g).connect(actx.destination); o.start(now+t); o.stop(now+t+.3); });
  }catch(e){}
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* =========================================================
   GÉNÉRATION DES EXERCICES
   ========================================================= */
function genEx(it, L){
  if(L==null) L=lvl(it.id);
  if(it.kind==='word') return genWord(it,L);
  if(it.kind==='gram') return genGram(it,L);
  const e = pick(it.ex); return Object.assign({}, e, {item:it});
}
// distracteurs sans synonymes entre eux
function distinct(list,n){ const out=[]; for(const w of shuffle(list)){ if(out.every(o=>!sameFr(o,w) && o.en!==w.en)) out.push(w); if(out.length===n) break; } return out; }
function genWord(it,L){
  const isLW = !!CATS[it.cats[0]];
  const isTh = it.cats[0].startsWith('th');
  const pool=[];
  pool.push('en2fr'); if(L>=1) pool.push('fr2en');
  if(isLW) pool.push('cat');
  if(it.s){ pool.push('gap','gap'); if(L>=2) pool.push('gap'); }
  if(L>=2 && isLW) pool.push('type','type');
  if(L>=3 && isLW) pool.push('type');
  if(isTh){ if(L>=1) pool.push('type'); if(L>=2) pool.push('type','type'); }
  if(it.build) pool.push('build','build');
  const t = pick(pool);
  const sameGroup = w => isLW ? !!CATS[w.cats[0]] : w.cats[0]===it.cats[0];
  let peers = WORDS.filter(w=>w!==it && sameGroup(w) && !sameFr(w,it) && w.en!==it.en);
  if(isTh && peers.length<3) peers = peers.concat(WORDS.filter(w=>w.cats[0].startsWith('th') && w.cats[0]!==it.cats[0] && !sameFr(w,it)));
  const catName = isLW ? CATS[it.cats[0]].fr : isTh ? THEME_NAME[it.cats[0]] : 'vocabulaire de la lettre';
  const sayEx = it.s ? fillGap(it.s,it.en,it.keep) : it.en;
  if(t==='en2fr'){
    const ds = distinct(peers,3).map(w=>w.fr);
    return {t:'mcq',item:it,q:`Que veut dire « ${it.en} » ?`,speakQ:it.en,opts:[it.fr,...ds],why:it.tip||'',say:sayEx};
  }
  if(t==='fr2en'){
    const ds = distinct(peers.filter(w=>!w.cats.some(c=>it.cats.includes(c))||!isLW),3).map(w=>w.en);
    return {t:'mcq',item:it,q:`Comment dit-on « ${it.fr} » ?`,sub:catName,opts:[it.en,...ds],why:it.tip||'',say:it.en};
  }
  if(t==='cat'){
    const right = pick(it.cats);
    const ds = sample(Object.keys(CATS).filter(c=>!it.cats.includes(c)),3);
    return {t:'mcq',item:it,q:`« ${it.en} » sert à exprimer…`,speakQ:it.en,opts:[right,...ds].map(c=>CATS[c].ic+'  '+CATS[c].fr),why:`${it.en} = ${it.fr}. ${it.tip||''}`,say:it.en};
  }
  if(t==='gap'){
    return {t:'gap',item:it,s:it.s,a:it.en,d:it.d,keep:it.keep,why:`${it.en} = ${it.fr}. ${it.tip||''}`};
  }
  if(t==='type'){
    const alts = WORDS.filter(w=>(isLW? !!CATS[w.cats[0]] : w.cats[0]===it.cats[0]) && sameFr(w,it)).map(w=>w.en);
    const accept = isTh ? [...new Set(alts.flatMap(a=>[a,stripArt(a)]))] : alts;
    return {t:'type',item:it,q:`Écris en anglais : « ${it.fr} »`,sub:catName,a:it.en,accept,alts,why:it.tip||'',say:sayEx};
  }
  if(t==='build'){
    return {t:'build',item:it,q:`Traduis : « ${it.build.fr} »`,a:it.build.en,extra:it.build.extra,why:it.tip||''};
  }
}
function genGram(it,L){
  const g=it.g;
  if(L>=1 && Math.random()<.3){
    const others = sample(GRAM.filter(x=>x!==g),3).map(x=>x.name);
    const sentence = Math.random()<.5? g.ex : fillGap(...(pick(g.gaps).slice(0,2)));
    return {t:'mcq',item:it,q:'Quelle structure est utilisée ici ?',quote:sentence,speakQ:sentence,opts:[g.name,...others],why:g.fr,say:sentence};
  }
  const [s,a,d,why]=pick(g.gaps);
  return {t:'gap',item:it,s,a,d,why:why+' ('+g.fr+')',keep:true};
}
function fillGap(s,w,keep){ const atStart=s.trim().startsWith('___'); return s.replace('___',fmtGap(w,atStart,keep)); }

function buildSession(unitId){
  const now=Date.now();
  let pool = unitId ? ITEMS.filter(i=>i.units.includes(unitId)) : ITEMS;
  const due = pool.filter(i=>isDue(i.id)).sort((a,b)=>rec(a.id).due-rec(b.id).due);
  const fresh = pool.filter(i=>!rec(i.id));
  const weak = pool.filter(i=>rec(i.id)&&!isDue(i.id)).sort((a,b)=>(lvl(a.id)-lvl(b.id))||(rec(a.id).last-rec(b.id).last));
  const N = unitId?10:12;
  let chosen = due.slice(0, unitId?7:N);
  const nNew = unitId? Math.min(5, N-chosen.length) : Math.min(3, N-chosen.length);
  chosen = chosen.concat(fresh.slice(0,Math.max(0,nNew)));
  for(const w of weak){ if(chosen.length>=N) break; if(!chosen.includes(w)) chosen.push(w); }
  for(const f of fresh){ if(chosen.length>=N) break; if(!chosen.includes(f)) chosen.push(f); }
  // entrelacement : on mélange tout
  chosen = shuffle(chosen);
  const q = chosen.map(it=>({item:it, ex:genEx(it), first:true}));
  // un jeu de paires au milieu (associations rapides)
  const pw = (unitId? pool : ITEMS).filter(i=>i.kind==='word');
  if(pw.length>=5){
    const picked=[]; for(const w of shuffle(pw)){ if(picked.every(p=>!sameFr(p,w))) picked.push(w); if(picked.length===5) break; }
    q.splice(Math.min(5,q.length), 0, {item:null, ex:{t:'pairs',words:picked}, first:false});
  }
  return q;
}

/* ---- export / import ---- */
function exportCode(){ const data={app:'writing-quest',v:1,exportedAt:new Date().toISOString(),state:S};
  return 'WQ1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
function parseBackup(txt){
  txt=String(txt||'').trim(); if(!txt) throw new Error('vide');
  let obj;
  if(txt.startsWith('WQ1:')) obj=JSON.parse(decodeURIComponent(escape(atob(txt.slice(4).replace(/\s+/g,'')))));
  else obj=JSON.parse(txt);
  const st = obj && obj.state ? obj.state : obj;
  if(!st || typeof st.srs!=='object') throw new Error('format');
  return st;
}
function mergeState(inc){
  let n=0;
  for(const [id,r] of Object.entries(inc.srs||{})){ const mine=S.srs[id]; if(!mine || (r.last||0)>(mine.last||0)){ S.srs[id]=r; n++; } }
  for(const [d,x] of Object.entries(inc.days||{})) S.days[d]=Math.max(S.days[d]||0,x||0);
  S.xp=Math.max(S.xp||0,inc.xp||0);
  if(inc.lastDay && (!S.lastDay || inc.lastDay>S.lastDay || (inc.lastDay===S.lastDay && (inc.streak||0)>(S.streak||0)))){ S.lastDay=inc.lastDay; S.streak=inc.streak||0; }
  if(inc.goal) S.goal=inc.goal;
  return n;
}
function doImport(txt){
  try{ const st=parseBackup(txt); const n=mergeState(st); save(); render(); toast(`Progression importée : ${n} notion${n>1?'s':''} mise${n>1?'s':''} à jour`); }
  catch(e){ toast('Code non reconnu : colle le code complet qui commence par WQ1:'); }
}

let cur=null; // {check:()=>({ok, answer}), ready}

  const isNew = it && !rec(it.id);
  const kickerTxt = {mcq:'Choisis la bonne réponse',gap:'Complète la phrase',type:'Écris de mémoire',build:'Construis la phrase',order:'Remets dans l\'ordre',tf:'Vrai ou faux ?',pairs:'Associe les paires'}[ex.t];
  let h=`<div class="kicker">${kickerTxt}${isNew?'<span class="new">NOUVEAU</span>':''}</div>`;
  cur={};
  if(ex.t==='mcq'){
    const right=ex.opts[0]; const opts=shuffle(ex.opts);
    h+=`<div class="qrow">${MASCOT()}<div class="speech"><span>${esc(ex.q)}${ex.sub?`<br><small class="muted" style="font-weight:700">(${esc(ex.sub)})</small>`:''}</span>${ex.speakQ?`<button class="say" data-say="${esc(ex.speakQ)}" aria-label="Écouter">🔊</button>`:''}</div></div>
      ${ex.quote?`<div class="sentence"><span>${esc(ex.quote)}</span></div>`:''}
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>`;
    box.innerHTML=h; let sel=-1;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); beep('tap'); setReady(true); if(/[a-z]/i.test(opts[sel])&&ex.say===opts[sel]) speak(opts[sel]); });
    cur.keys=n=>{ const b=box.querySelector(`.opt[data-i="${n}"]`); if(b) b.click(); };
    cur.check=()=>{ const ok=opts[sel]===right; box.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled=true; if(opts[i]===right) x.classList.add('right'); else if(i===sel) x.classList.add('wrong'); }); return {ok, answer:right}; };
  }
  else if(ex.t==='gap'){
    const atStart=ex.s.trim().startsWith('___');
    const opts=shuffle([ex.a,...ex.d]);

    const [pre,post]=ex.s.split('___');
    h+=`<div class="sentence"><span>${esc(pre)}<span class="blank" id="blank">&nbsp;</span>${esc(post)}</span><button class="say" data-say="${esc(ex.s)}" aria-label="Écouter">🔊</button></div>
      <div class="opts two">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(show(o))}</span></button>`).join('')}</div>`;
    box.innerHTML=h; let sel=-1;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); $('#blank').textContent=show(opts[sel]); beep('tap'); setReady(true); });
    cur.keys=n=>{ const b=box.querySelector(`.opt[data-i="${n}"]`); if(b) b.click(); };
    ex.say = ex.s.replace('___',show(ex.a));
    cur.check=()=>{ const ok=opts[sel]===ex.a; box.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled=true; if(opts[i]===ex.a) x.classList.add('right'); else if(i===sel) x.classList.add('wrong'); }); $('#blank').textContent=show(ex.a); return {ok, answer:show(ex.a)}; };
  }
  else if(ex.t==='type'){
    h+=`<div class="qrow">${MASCOT()}<div class="speech"><span>${esc(ex.q)}${ex.sub?`<br><small class="muted" style="font-weight:700">(${esc(ex.sub)})</small>`:''}</span></div></div>
      <input class="typein" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape ta réponse en anglais">
      <button class="hintbtn" id="hint">Un indice ?</button>`;
    box.innerHTML=h; const inp=$('#tin'); setTimeout(()=>inp.focus(),50);
    inp.oninput=()=>setReady(inp.value.trim().length>0);
    inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()){ e.preventDefault(); e.stopPropagation(); $('#act').click(); } };
    let hints=0; L.hinted=false;
    $('#hint').onclick=()=>{ hints++; L.hinted=true; const n=Math.min(ex.a.length, hints*2); const nw=ex.a.split(' ').length; $('#hint').textContent='Indice : '+ex.a.slice(0,n)+'…  ('+nw+' mot'+(nw>1?'s':'')+')'; };
    cur.check=()=>{ inp.disabled=true; const v=norm(inp.value); const acc=(ex.accept||[ex.a]).map(norm);
      if(acc.includes(v)){ const others=(ex.alts||ex.accept||[]).filter(a=>norm(a)!==v && norm(stripArt(a))!==v); return {ok:true, answer:ex.a, extra: others.length?'Autres réponses possibles : '+others.join(', '):''}; }
      const close=acc.find(a=>a.length>=5 && lev(a,v)<=1);
      if(close) return {ok:true, answer:ex.a, extra:'Attention à l\'orthographe : '+(ex.accept||[ex.a]).find(a=>norm(a)===close)};
      return {ok:false, answer:ex.a}; };
  }
  else if(ex.t==='build' || ex.t==='order'){
    const isOrder=ex.t==='order';
    const target = isOrder? ex.items : ex.a.split(' ');
    const tiles = shuffle((isOrder?target:target.concat(ex.extra||[])).map((w,i)=>({w,id:i})));
    h+=`<div class="qrow">${MASCOT()}<div class="speech"><span>${esc(ex.q)}</span></div></div>
      <div class="answerline ${isOrder?'col':''}" id="ans"></div>
      <div class="bank ${isOrder?'col':''}" id="bank">${tiles.map(t=>`<button class="tok" data-id="${t.id}">${esc(t.w)}</button>`).join('')}</div>`;
    box.innerHTML=h; const chosen=[];
    const draw=()=>{ $('#ans').innerHTML=chosen.map((t,k)=>`<button class="tok" data-k="${k}">${isOrder?`<span class="n">${k+1}</span>`:''}${esc(t.w)}</button>`).join('');
      box.querySelectorAll('#bank .tok').forEach(b=>b.classList.toggle('used',chosen.some(c=>c.id==b.dataset.id)));
      $('#ans').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{ chosen.splice(+b.dataset.k,1); beep('tap'); draw(); });
      setReady(isOrder? chosen.length===target.length : chosen.length>0); };
    box.querySelectorAll('#bank .tok').forEach(b=>b.onclick=()=>{ if(b.classList.contains('used'))return; chosen.push(tiles.find(t=>t.id==b.dataset.id)); beep('tap'); draw(); });
    draw();
    if(!isOrder) ex.say=ex.a;
    cur.check=()=>{ box.querySelectorAll('.tok').forEach(b=>b.disabled=true); const got=chosen.map(c=>c.w).join(' | '); const ok=got===target.join(' | ');
      return {ok, answer: isOrder? target.map((t,i)=>(i+1)+'. '+t).join('  ') : ex.a}; };
  }
  else if(ex.t==='tf'){
    h+=`<div class="qrow">${MASCOT()}<div class="speech"><span>${esc(ex.q)}</span></div></div>
      <div class="opts two"><button class="opt big" data-v="1"><span>👍 Vrai</span></button><button class="opt big" data-v="0"><span>👎 Faux</span></button></div>`;
    box.innerHTML=h; let sel=null;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=b.dataset.v==='1'; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); beep('tap'); setReady(true); });
    cur.keys=n=>{ const b=box.querySelectorAll('.opt')[n]; if(b) b.click(); };
    cur.check=()=>{ const ok=sel===ex.a; box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; const v=x.dataset.v==='1'; if(v===ex.a) x.classList.add('right'); else if(v===sel) x.classList.add('wrong'); }); return {ok, answer: ex.a?'Vrai':'Faux'}; };
  }
  else if(ex.t==='pairs'){
    const ws=ex.words; const left=shuffle(ws), right=shuffle(ws);
    h+=`<div class="qrow">${MASCOT()}<div class="speech"><span>Touche un mot anglais puis sa traduction.</span></div></div>
      <div class="pairs"><div class="col">${left.map(w=>`<button class="pair" data-side="en" data-id="${esc(w.id)}">${esc(w.en)}</button>`).join('')}</div>
      <div class="col">${right.map(w=>`<button class="pair" data-side="fr" data-id="${esc(w.id)}">${esc(w.fr)}</button>`).join('')}</div></div>`;
    box.innerHTML=h; $('#act').hidden=true;
    let selEl=null, done=0, errs=0;
    box.querySelectorAll('.pair').forEach(b=>b.onclick=()=>{
      if(b.dataset.side==='en') speak(b.textContent);
      if(!selEl || selEl.dataset.side===b.dataset.side){ if(selEl) selEl.classList.remove('sel'); selEl=b; b.classList.add('sel'); beep('tap'); return; }
      if(selEl.dataset.id===b.dataset.id){ selEl.classList.remove('sel'); selEl.classList.add('done'); b.classList.add('done'); done++; beep('ok'); selEl=null;
        if(done===ws.length){ cur.result={ok:errs<=1, pairs:true, errs}; setTimeout(()=>doCheck(),350); } }
      else { const a=selEl, c=b; a.classList.add('err'); c.classList.add('err'); errs++; beep('bad'); setTimeout(()=>{a.classList.remove('err','sel');c.classList.remove('err');},400); selEl=null; }
    });
    cur.check=()=>cur.result;
  }
  // boutons 🔊 dans la question
  box.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say);});
  if(ex.speakQ && (ex.t==='mcq')) setTimeout(()=>speak(ex.speakQ),250);
}
function doCheck(){
  const ent=L.q[L.i]; const ex=ent.ex; const it=ent.item;
  const res=cur.check(); if(!res) return;
  const ok=res.ok;
  // XP & SRS
  if(ex.t==='pairs'){ if(ok){ L.xp+=10; } ex.words.forEach(w=>{ if(!rec(w.id)) return; }); }
  else {
    L.answered++;
    if(ent.first){ grade(it.id, ok && !(ex.t==='type'&&L.hinted)); }
    if(ok){ L.ok++; L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.xp += ent.first?10:5; if(L.combo>0&&L.combo%5===0) L.xp+=5; }
    else { L.combo=0;
      L.retries[it.id]=(L.retries[it.id]||0)+1;
      if(L.retries[it.id]<=2){ const pos=Math.min(L.q.length, L.i+3); L.q.splice(pos,0,{item:it, ex:genEx(it, Math.max(0,lvl(it.id)-1)), first:false}); }
    }
  }
  beep(ok?'ok':'bad');
  const foot=$('#foot'); foot.className='lfoot '+(ok?'ok':'bad');
  const say = ex.say;
  let title, line='';
  if(ex.t==='pairs'){ title= ok? (res.errs?'Bien joué !':'Sans faute !') : 'Paires terminées'; line = res.errs? `${res.errs} erreur${res.errs>1?'s':''} en route.` : 'Associations rapides = mémoire solide.'; }
  else if(ok){ title=pick(PRAISE); if(L.combo>=3) title+=` 🔥 ${L.combo} d'affilée`; line = res.extra||''; }
  else { title=pick(SOFT); line = `Bonne réponse : <b>${esc(res.answer)}</b>`; }
  const why = ex.why ? `<p class="why">${esc(ex.why)}</p>` : '';
  const growth = (!ok && ex.t!=='pairs')? `<p class="why">💪 ${pick(GROWTH)}</p>`:'';
  $('#fb').innerHTML=`<div class="badge">${ok?'✅':'💡'}</div><div class="fbtext"><h3>${title}</h3>${line?`<p>${ok?esc(line):line}</p>`:''}${why}${growth}</div>${say?`<button class="say" id="fbsay" aria-label="Écouter">🔊</button>`:''}`;
  if(say){ $('#fbsay').onclick=()=>speak(say); if(ok) setTimeout(()=>speak(say),150); }
  const act=$('#act'); act.hidden=false; act.disabled=false; act.textContent='Continuer'; act.className='btn '+(ok?'ok':'bad');
  act.onclick=next; setTimeout(()=>act.focus(),30);
  $('#combo').textContent = L.combo>=3?`🔥 ×${L.combo}`:'';
  save();
}
function next(){
  L.i++;
  if(L.i>=L.q.length) return finish();
  showEx(); $('.lbody').scrollTop=0;
}
function finish(){
  $('#pg').style.width='100%';
  const t=dayKey(), y=dayKey(new Date(Date.now()-DAY));
  if(S.lastDay!==t){ S.streak = (S.lastDay===y)? (S.streak||0)+1 : 1; S.lastDay=t; }
  S.xp+=L.xp; S.days[t]=(S.days[t]||0)+L.xp; save();
  const acc = L.answered? Math.round(L.ok/L.answered*100):100;
  const secs=Math.round((Date.now()-L.start)/1000); const mm=Math.floor(secs/60), ss=String(secs%60).padStart(2,'0');
  const goalHit = S.days[t]>=S.goal && (S.days[t]-L.xp)<S.goal;
  const msg = acc>=90? 'Ton cerveau a bien bossé. Les notions reviendront au bon moment pour s\'ancrer durablement.'
    : acc>=60? 'Belle séance. Les notions ratées reviendront plus vite, c\'est voulu : c\'est comme ça qu\'on progresse.'
    : 'Les débuts sont toujours les plus durs. Chaque erreur d\'aujourd\'hui reviendra demain, et tu la reconnaîtras.';
  const box=$('.lbody'); $('#foot').className='lfoot'; $('#fb').innerHTML='';
  box.innerHTML=`<div class="result">
    ${MASCOT().replace('class="mascot"','width="120" height="120"')}
    <h1>${goalHit?'Objectif du jour atteint !':'Leçon terminée !'}</h1>
    <p>${msg}</p>
    <div class="tiles">
      <div class="tile" style="--tc:var(--sun-d)"><span>XP gagnés</span><b>+${L.xp}</b></div>
      <div class="tile" style="--tc:var(--ok)"><span>Précision</span><b>${acc}%</b></div>
      <div class="tile" style="--tc:var(--c4)"><span>Temps</span><b>${mm}:${ss}</b></div>
    </div>
    ${L.maxCombo>=3?`<p style="color:var(--flame)">🔥 Meilleure série : ${L.maxCombo} bonnes réponses d'affilée</p>`:''}
    <p>🔥 Série : ${S.streak} jour${S.streak>1?'s':''}</p>
  </div>`;
  const act=$('#act'); act.hidden=false; act.disabled=false; act.className='btn'; act.textContent='Continuer';
  act.onclick=()=>{ closeLesson(); render(); };
  $('#combo').textContent='';
  beep('win'); confetti();
}

document.addEventListener('keydown',e=>{
  if(!$('#lesson')) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Enter'){ e.preventDefault(); const a=$('#act'); if(a && !a.disabled && !a.hidden){ a.click(); } }
  if(/^[1-4]$/.test(e.key) && cur && cur.keys && $('#foot').className==='lfoot'){ cur.keys(+e.key-1); }
  if(e.key==='Escape') endEarly();
});

/* ---- confettis ---- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'); c.hidden=false; const ctx=c.getContext('2d'); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement); const cols=['--c1','--c2','--c3','--c4','--c5','--c6','--sun'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0; (function loop(){ ctx.clearRect(0,0,W,H); P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(++f<150) requestAnimationFrame(loop); else { ctx.clearRect(0,0,W,H); c.hidden=true; } })();
}

render();
</script>
